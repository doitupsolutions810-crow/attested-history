name: history-verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile verifier and tests
        run: python -m py_compile verify.py tests/test_verify.py
      - name: Run fail-closed verifier tests
        run: python -m unittest discover -s tests -v
